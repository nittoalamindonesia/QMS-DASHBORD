<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Tooling Schedule - PT NITTO ALAM INDONESIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #F1F5F9;
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100vw;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #E5E7EB; }
        ::-webkit-scrollbar-thumb { background: #0284C7; border-radius: 10px; }
        
        /* Grid Layout untuk Kartu Kotak / Persegi */
        .square-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
            padding: 1rem;
        }

        /* Kartu Persegi (Square Aspect Ratio) */
        .square-card {
            background: #FFFFFF;
            border-radius: 1.25rem;
            border: 1px solid #E2E8F0;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .square-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.1);
            border-color: #0284C7;
        }

        /* Card Expansion Effect */
        .square-card.expanded {
            aspect-ratio: auto;
            grid-column: span 2;
            border-color: #0284C7;
            background: #F0F9FF;
            box-shadow: 0 20px 25px -5px rgba(2, 132, 199, 0.15);
        }

        @media (max-width: 640px) {
            .square-card.expanded {
                grid-column: span 1;
            }
        }

        /* Status Badge */
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 700;
        }
        .status-order { background: #DBEAFE; color: #1E40AF; }
        .status-shipped { background: #DCFCE7; color: #166534; }
        .status-delayed { background: #FEE2E2; color: #991B1B; }

        /* Sidebar Overlay */
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(3px); z-index: 998; display: none; }
        .menu-overlay.active { display: block; }
        .popup-sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #FFFFFF; border-right: 1px solid #E5E7EB; z-index: 999; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .popup-sidebar.active { left: 0; }
        .logo-section { padding: 0.75rem 1rem; border-bottom: 1px solid #E5E7EB; }
        #menu-container { flex: 1; padding: 0.25rem 0; overflow-y: auto; }
        .menu-item { margin: 0.1rem 0.5rem; }
        .menu-button { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.6rem; border-radius: 0.4rem; color: #475569; text-decoration: none; font-size: 0.8rem; transition: all 0.15s; }
        .menu-button:hover { background: #F0F9FF; color: #0284C7; transform: translateX(3px); }
        .menu-button.active { background: #E0F2FE; color: #0284C7; border-left: 3px solid #0284C7; font-weight: 600; }
        .menu-icon { font-size: 1rem; min-width: 1.6rem; text-align: center; }
        .sidebar-logout-btn { margin: 0.5rem 0.8rem; display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.6rem; border-radius: 0.4rem; cursor: pointer; border-top: 1px solid #E5E7EB; transition: all 0.15s; color: #475569; font-size: 0.8rem; }
        .sidebar-logout-btn:hover { background: #FEE2E2; color: #EF4444; }
        .sidebar-footer { text-align: center; padding: 0.3rem; color: #94A3B8; font-size: 0.6rem; border-top: 1px solid #E5E7EB; }

        .hamburger-btn { background: #F0F9FF; border: 1px solid #0284C7; border-radius: 0.5rem; padding: 0.25rem 0.5rem; cursor: pointer; }
        .running-text { background: #F8FAFC; border-top: 1px solid #E5E7EB; border-bottom: 1px solid #E5E7EB; }
        .running-text marquee { font-size: 0.7rem; font-weight: 600; color: #0284C7; padding: 0.25rem 0; }
        .digital-clock { font-family: 'Courier New', monospace; font-weight: 700; background: #F8FAFC; padding: 0.25rem 0.75rem; border-radius: 0.5rem; border: 1px solid #E5E7EB; color: #0284C7; font-size: 1rem; }
        .text-brand { color: #1A63F6; }
        .tooling-countdown { font-family: 'Courier New', monospace; font-size: 0.8rem; font-weight: bold; color: #0284C7; }
    </style>
</head>
<body>

    <!-- OVERLAY & SIDEBAR -->
    <div id="menuOverlay" class="menu-overlay" onclick="toggleMenu()"></div>
    <div id="popupSidebar" class="popup-sidebar">
        <div class="logo-section">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-gradient-to-br from-[#1A63F6] to-[#0284C7] rounded-lg flex items-center justify-center">
                    <span class="text-white text-xs font-bold">NS</span>
                </div>
                <div>
                    <h1 class="text-xs font-bold">NITTO SEIKO</h1>
                    <p class="text-slate-500 text-[7px]">Plant 2</p>
                </div>
            </div>
        </div>
        <div id="menu-container"></div>
        <div class="sidebar-logout-btn" onclick="logout()">
            <span class="menu-icon">🚪</span>
            <span>Logout</span>
        </div>
        <div class="sidebar-footer">System Online</div>
    </div>

    <div class="flex flex-col h-screen w-full overflow-hidden">
        <!-- TOP BAR -->
        <div class="bg-white border-b border-gray-200 px-3 py-1.5 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-2">
                <div class="hamburger-btn" onclick="toggleMenu()"><span class="text-gray-700 text-sm">☰</span></div>
                <div><h1 class="text-sm font-bold text-brand">PT NITTO ALAM INDONESIA</h1><p class="text-slate-500 text-[8px]">Plant 2 - Tooling Schedule</p></div>
            </div>
            <div class="flex items-center gap-2">
                <div class="digital-clock" id="clock">00:00:00</div>
                <div class="flex items-center gap-1 bg-green-50 px-2 py-0.5 rounded-lg">
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-green-600 text-[8px] font-bold">LIVE FIRESTORE</span>
                </div>
            </div>
        </div>

        <!-- RUNNING TEXT -->
        <div class="running-text shrink-0">
            <marquee behavior="scroll" direction="left" scrollamount="2">
                🏆 TOOLING SCHEDULE MONITORING 🏆 | Live Sync Firestore (Bot WA) | PT Nitto Alam Indonesia
            </marquee>
        </div>

        <!-- MAIN CONTENT (SQUARE CARD GRID) -->
        <div class="flex-1 overflow-y-auto p-4">
            <div id="square-card-container" class="square-grid">
                <div class="col-span-full text-center text-slate-400 py-10">Mengambil data dari Firestore...</div>
            </div>
        </div>
    </div>

    <!-- FIREBASE MODULE SDK (V10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAz-MvIPiv4tZliNQ6iZL9NMpTV5upAiM",
            authDomain: "engineering-system-93af1.firebaseapp.com",
            projectId: "engineering-system-93af1",
            storageBucket: "engineering-system-93af1.firebasestorage.app",
            messagingSenderId: "1066633617612",
            appId: "1:1066633617612:web:6b4915f61dc8dc99ada269",
            measurementId: "G-6YGGTRD1S5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toolingData = [];
        const toolingColRef = collection(db, 'tooling_orders'); 

        // READ REALTIME DATA SESUAI URUTAN ASLI DATABASE
        onSnapshot(toolingColRef, (snapshot) => {
            const list = [];
            snapshot.forEach((doc) => {
                const item = doc.data();
                const po = item.order_date || (item.created_at ? item.created_at.split('T')[0] : '');
                
                // Prioritaskan ETA asli dari database, jika tidak ada baru hitung +60 hari dari PO
                let eta = item.eta_date || item.eta || '';
                if (!eta && po) {
                    const d = new Date(po);
                    if (!isNaN(d)) {
                        d.setDate(d.getDate() + 60);
                        eta = d.toISOString().split('T')[0];
                    }
                }

                list.push({
                    id: doc.id,
                    partName: item.item_name || '-',
                    tooling: item.item_type || '-',
                    qty: item.qty || 1,
                    poDate: po,
                    etaDate: eta,
                    statusOrder: item.status || 'ORDERED',
                    createdVia: item.created_via || 'WhatsApp'
                });
            });

            // Menyimpan urutan persis dari snapshot Database
            window.toolingData = list;
            renderSquareCards();
        }, (error) => {
            console.error("Gagal mengambil data Firestore:", error);
            document.getElementById('square-card-container').innerHTML = `<p class="col-span-full text-red-500 text-center py-4">Gagal mengambil data dari Firestore!</p>`;
        });
    </script>

    <!-- UI & EXPANDABLE CARD LOGIC -->
    <script>
        const adminMenus = [
            { icon: "📊", name: "Main Dashboard", link: "../maindashboard/maindashboard.html" },
            { icon: "🧪", name: "Main Dashboard Plating", link: "../maindashboard/maindashboardplating.html" },
            { icon: "📅", name: "Activity Schedule", link: "../menu/activityschedule.html" },
            { icon: "🏭", name: "Production", link: "../menu/production.html" },
            { icon: "🔍", name: "Audit Finding", link: "../menu/audit.html" },
            { icon: "📄", name: "Design Review", link: "../menu/rfq.html" },
            { icon: "💰", name: "Sales Monitoring", link: "../menu/mountsales.html" },
            { icon: "🔧", name: "Schedule Tooling", link: "../menu/tooling.html" },
            { icon: "✅", name: "Claim", link: "../menu/claim.html" },
            { icon: "🔬", name: "QC", link: "../menu/qc.html" }
        ];

        function renderMenu() {
            const menuContainer = document.getElementById('menu-container');
            let menuHtml = '';
            adminMenus.forEach(menu => {
                const isCurrentPage = menu.link.includes('tooling.html');
                const activeClass = isCurrentPage ? 'active' : '';
                menuHtml += `
                    <div class="menu-item">
                        <a href="${menu.link}" class="menu-button ${activeClass}">
                            <span class="menu-icon">${menu.icon}</span>
                            <span>${menu.name}</span>
                        </a>
                    </div>
                `;
            });
            menuContainer.innerHTML = menuHtml;
        }

        function toggleMenu() {
            document.getElementById('popupSidebar').classList.toggle('active');
            document.getElementById('menuOverlay').classList.toggle('active');
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = '../entry/login.html';
        }

        function updateClock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('id-ID', { hour12: false });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function getDaysRemaining(dateStr) {
            if (!dateStr) return 0;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(dateStr);
            target.setHours(0, 0, 0, 0);
            return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        }

        function getStatus(etaDate) {
            const days = getDaysRemaining(etaDate);
            if (days < 0) return { text: "Delayed", class: "status-delayed", icon: "⚠️" };
            if (days <= 30) return { text: "Coming Soon", class: "status-shipped", icon: "🚚" };
            return { text: "On Order", class: "status-order", icon: "📦" };
        }

        // RENDER KARTU PERSEGI & CARD EXPANSION
        function renderSquareCards() {
            const container = document.getElementById('square-card-container');
            const data = window.toolingData || [];

            if (data.length === 0) {
                container.innerHTML = `<p class="col-span-full text-slate-400 text-center py-10">Belum ada order tooling di Firestore.</p>`;
                return;
            }

            // Render sesuai urutan database tanpa sorting JavaScript tambahan
            container.innerHTML = data.map((item, idx) => {
                const status = getStatus(item.etaDate);
                const days = getDaysRemaining(item.etaDate);
                const countdownText = days < 0 ? `Telat ${Math.abs(days)} hari` : (days === 0 ? 'Hari ini ETA!' : `${days} hari menuju ETA`);

                return `
                    <div class="square-card" id="card-${idx}" onclick="toggleCardExpansion(${idx})">
                        <!-- HEADER KARTU -->
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="status-pill ${status.class}">${status.icon} ${status.text}</span>
                                <span class="text-[10px] font-bold text-slate-400">x${item.qty}</span>
                            </div>
                            <h3 class="font-bold text-sm text-slate-800 line-clamp-2 mb-1" title="${item.partName}">
                                🔧 ${item.partName}
                            </h3>
                            <p class="text-[11px] text-slate-500 font-medium">Type: ${item.tooling}</p>
                        </div>

                        <!-- DETAIL AMAN/EXPANDABLE -->
                        <div class="expand-details hidden mt-3 pt-3 border-t border-slate-200 text-xs text-slate-600 space-y-1">
                            <div class="flex justify-between">
                                <span class="text-slate-400">📅 PO Date:</span>
                                <span class="font-semibold text-slate-700">${formatDate(item.poDate)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">🎯 ETA Date:</span>
                                <span class="font-semibold text-slate-700">${formatDate(item.etaDate)}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-slate-400">💬 Input Via:</span>
                                <span class="font-semibold text-slate-700">${item.createdVia}</span>
                            </div>
                        </div>

                        <!-- FOOTER COUNTDOWN -->
                        <div class="mt-2 pt-2 border-t border-slate-100 flex justify-between items-center">
                            <span class="tooling-countdown">${countdownText}</span>
                            <span class="text-[10px] text-sky-600 font-bold expand-btn-text">Detail ▼</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // TOGGLE EXPANDABLE CARD
        function toggleCardExpansion(index) {
            const card = document.getElementById(`card-${index}`);
            if (!card) return;

            const details = card.querySelector('.expand-details');
            const btnText = card.querySelector('.expand-btn-text');

            const isExpanded = card.classList.contains('expanded');

            // Tutup semua kartu lain
            document.querySelectorAll('.square-card').forEach(c => {
                c.classList.remove('expanded');
                const d = c.querySelector('.expand-details');
                const b = c.querySelector('.expand-btn-text');
                if (d) d.classList.add('hidden');
                if (b) b.innerText = 'Detail ▼';
            });

            // Toggle kartu terpilih
            if (!isExpanded) {
                card.classList.add('expanded');
                if (details) details.classList.remove('hidden');
                if (btnText) btnText.innerText = 'Tutup ▲';
            }
        }

        // INIT
        renderMenu();
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
